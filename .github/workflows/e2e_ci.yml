name: End-to-End Test CI

on:
  push:
    branches: [ main, dev, 'agents/**', 'dev/**' ]
    paths:
      - 'client/**'
      - 'backend/**'
      - 'e2e/**'
      - 'scripts/**'
      - 'playwright.config.ts'
      - 'package.json'
      - '.github/workflows/e2e_ci.yml'
  pull_request:
    branches: [ main, dev ]
    paths:
      - 'client/**'
      - 'backend/**'
      - 'e2e/**'
      - 'scripts/**'
      - 'playwright.config.ts'
      - 'package.json'
      - '.github/workflows/e2e_ci.yml'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e-test:
    name: Playwright E2E Integration
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Validate Branch Name
        if: github.event_name == 'pull_request'
        run: |
          BRANCH_NAME="${{ github.head_ref }}"
          if [[ ! "$BRANCH_NAME" =~ ^(agents|dev)/[0-9]+-.+$ ]]; then
            echo "🛑 ERROR: Pull request branch name '$BRANCH_NAME' does not follow SDLC conventions!"
            echo "Branch name must match the pattern: agents/<issue_id>-<description> or dev/<issue_id>-<description>"
            echo "Example: agents/42-setup-login-page"
            exit 1
          fi
          echo "✅ Branch name '$BRANCH_NAME' is valid."

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install Root Dependencies
        run: npm ci

      - name: Install Backend Dependencies
        run: npm ci
        working-directory: backend/functions

      - name: Install Client Dependencies
        run: flutter pub get
        working-directory: client

      - name: Build Backend Functions
        run: npm run backend:build

      - name: Build Flutter Client (Release)
        run: flutter build web --release
        working-directory: client

      - name: Install Playwright Chromium Browser
        run: npx playwright install --with-deps chromium

      - name: Run E2E Test Suite
        run: npm run test:e2e:ci

      - name: Upload Test Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-test-artifacts
          path: |
            playwright-report/
            test-results/
          retention-days: 30
