name: End-to-End Test CI

on:
  push:
    branches: [ main, dev, 'agents/**', 'dev/**' ]
    paths:
      - 'client/**'
      - 'backend/**'
      - 'e2e/**'
      - 'scripts/**'
      - 'playwright.config.ts'
      - 'package.json'
      - '.github/workflows/e2e_ci.yml'
  pull_request:
    branches: [ main, dev ]
    paths:
      - 'client/**'
      - 'backend/**'
      - 'e2e/**'
      - 'scripts/**'
      - 'playwright.config.ts'
      - 'package.json'
      - '.github/workflows/e2e_ci.yml'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e-test:
    name: Playwright E2E Integration
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Validate Branch Name
        if: github.event_name == 'pull_request'
        run: |
          BRANCH_NAME="${{ github.head_ref }}"
          if [[ ! "$BRANCH_NAME" =~ ^(agents|dev)/[0-9]+-.+$ ]]; then
            echo "🛑 ERROR: Pull request branch name '$BRANCH_NAME' does not follow SDLC conventions!"
            echo "Branch name must match the pattern: agents/<issue_id>-<description> or dev/<issue_id>-<description>"
            echo "Example: agents/42-setup-login-page"
            exit 1
          fi
          echo "✅ Branch name '$BRANCH_NAME' is valid."

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '21'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: |
            package-lock.json
            backend/functions/package-lock.json

      - name: Cache Firebase Emulators
        uses: actions/cache@v4
        with:
          path: ~/.cache/firebase/emulators
          key: ${{ runner.os }}-firebase-emulators-${{ hashFiles('backend/functions/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-firebase-emulators-

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install Root Dependencies
        run: npm ci

      - name: Install Backend Dependencies
        run: npm ci
        working-directory: backend/functions

      - name: Cache Pub Dependencies
        uses: actions/cache@v4
        with:
          path: ~/.pub-cache
          key: ${{ runner.os }}-pub-cache-${{ hashFiles('client/pubspec.lock') }}
          restore-keys: |
            ${{ runner.os }}-pub-cache-

      - name: Install Client Dependencies
        run: flutter pub get
        working-directory: client

      - name: Build Backend Functions
        run: npm run backend:build

      - name: Cache Flutter Build Artifacts
        uses: actions/cache@v4
        with:
          path: client/.dart_tool
          key: ${{ runner.os }}-flutter-build-${{ hashFiles('client/pubspec.lock') }}-${{ github.run_id }}
          restore-keys: |
            ${{ runner.os }}-flutter-build-${{ hashFiles('client/pubspec.lock') }}-
            ${{ runner.os }}-flutter-build-

      - name: Cache Flutter Web Build
        uses: actions/cache@v4
        id: flutter-web-cache
        with:
          path: client/build/web
          key: ${{ runner.os }}-flutter-web-build-${{ hashFiles('client/pubspec.lock', 'client/lib/**', 'client/web/**', 'client/analysis_options.yaml') }}

      - name: Build Flutter Client (Release)
        if: steps.flutter-web-cache.outputs.cache-hit != 'true'
        run: flutter build web --release
        working-directory: client

      - name: Get Playwright version
        id: playwright-version
        run: echo "PLAYWRIGHT_VERSION=$(node -e "console.log(require('./package-lock.json').packages['node_modules/@playwright/test'].version)")" >> $GITHUB_ENV

      - name: Cache Playwright Browser
        uses: actions/cache@v4
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ env.PLAYWRIGHT_VERSION }}
          restore-keys: |
            ${{ runner.os }}-playwright-

      - name: Install Playwright Chromium Browser
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium

      - name: Install Playwright OS Dependencies Only
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium

      - name: Run E2E Test Suite
        run: npm run test:e2e:ci

      - name: Upload Test Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-test-artifacts
          path: |
            playwright-report/
            test-results/
          retention-days: 30
