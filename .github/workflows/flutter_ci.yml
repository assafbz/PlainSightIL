name: Flutter Quality CI

on:
  push:
    branches: [ main, dev, 'agents/**', 'dev/**' ]
    paths:
      - 'client/**'
      - '.github/workflows/flutter_ci.yml'
      - 'package.json'
  pull_request:
    branches: [ main, dev ]
    paths:
      - 'client/**'
      - '.github/workflows/flutter_ci.yml'
      - 'package.json'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Flutter Lint & Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Validate Branch Name
        if: github.event_name == 'pull_request'
        run: |
          BRANCH_NAME="${{ github.head_ref }}"
          if [[ ! "$BRANCH_NAME" =~ ^(agents|dev)/[0-9]+-.+$ ]]; then
            echo "🛑 ERROR: Pull request branch name '$BRANCH_NAME' does not follow SDLC conventions!"
            echo "Branch name must match the pattern: agents/<issue_id>-<description> or dev/<issue_id>-<description>"
            echo "Example: agents/42-setup-login-page"
            exit 1
          fi
          echo "✅ Branch name '$BRANCH_NAME' is valid."

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.0'
          channel: 'stable'
          cache: true

      - name: Cache Flutter Build Artifacts
        uses: actions/cache@v4
        with:
          path: client/.dart_tool
          key: ${{ runner.os }}-flutter-build-${{ hashFiles('client/pubspec.lock') }}-${{ github.run_id }}
          restore-keys: |
            ${{ runner.os }}-flutter-build-${{ hashFiles('client/pubspec.lock') }}-
            ${{ runner.os }}-flutter-build-

      - name: Cache Pub Dependencies
        uses: actions/cache@v4
        with:
          path: ~/.pub-cache
          key: ${{ runner.os }}-pub-cache-${{ hashFiles('client/pubspec.lock') }}
          restore-keys: |
            ${{ runner.os }}-pub-cache-

      - name: Install Dependencies
        run: flutter pub get
        working-directory: client

      - name: Check Code Formatting
        run: dart format --set-exit-if-changed .
        working-directory: client

      - name: Static Analysis
        run: flutter analyze
        working-directory: client

      - name: Run Unit & Widget Tests
        run: flutter test --coverage
        working-directory: client

      - name: Verify Code Coverage Gateways
        run: dart run tool/check_coverage.dart
        working-directory: client

      - name: Run Test Existence Validation
        run: node scripts/check-test-existence.js

      - name: Verify Client Coverage Thresholds
        run: node scripts/check-coverage-thresholds.js --client
